          change('scripts/lib/beebot-collaboration-review.snippet.js','c.owner.textContent=t(`${name(task.assignee)} 负责 · ${name(task.reviewer)} 验收`,`${name(task.assignee)} owns · ${name(task.reviewer)} reviews`);','c.owner.textContent=task.state==="declined"?t(`原派给 ${name(task.assignee)} · ${name(task.reviewer)} 验收`,`Originally offered to ${name(task.assignee)} · ${name(task.reviewer)} reviews`):t(`${name(task.assignee)} 负责 · ${name(task.reviewer)} 验收`,`${name(task.assignee)} owns · ${name(task.reviewer)} reviews`);')
