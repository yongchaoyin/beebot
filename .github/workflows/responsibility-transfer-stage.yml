          change('source/host/extensions/transcript/collaboration.ts','If tools, access or the environment are missing, report the limitation; do not claim verified capability.','If tools, access or the environment are missing before any claim, decline with a reason. Only the original coordinator may reassign that unstarted work to a current colleague and independent reviewer (or re-offer a declined task to its recovered owner). These actions preserve scope and quotes, do not grant tools, and never transfer previously claimed work; use explicit Stop/inspection for possible external effects. Declined work is not completed. Do not claim verified capability.')
