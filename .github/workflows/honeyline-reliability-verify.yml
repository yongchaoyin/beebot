name: Verify Honeyline reliability increment
on:
  push:
    branches: [fix/honeyline-send-feedback-20260922]
    paths:
      - .github/workflows/honeyline-reliability-verify.yml
      - .github/honeyline-reliability.patch.xz.1
      - .github/honeyline-reliability.patch.xz.2
permissions:
  contents: read
jobs:
  apply-and-verify:
    if: github.repository == 'yongchaoyin/beebot' && github.ref == 'refs/heads/fix/honeyline-send-feedback-20260922'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - name: Apply the reviewed, checksum-pinned source increment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/honeyline-evidence
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          parts = [pathlib.Path('.github/honeyline-reliability.patch.xz.' + str(i)).read_text().strip() for i in (1, 2)]
          patch = lzma.decompress(base64.b64decode(''.join(parts), validate=True))
          expected = 'ef895db94d1da477194890ac7f764fd48baf1cb51dccc6990b03d5b462ce81cd'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch checksum mismatch'
          target = pathlib.Path('/tmp/honeyline-evidence/reliability.patch')
          target.write_bytes(patch)
          allowed = {
              'docs/implementation/honeyline-reliability.md',
              'frontend/src/honeyline/honeyline.css',
              'frontend/src/honeyline/packaged-ui.ts',
              'frontend/src/honeyline/status.ts',
              'frontend/src/node-chat/view.tsx',
              'frontend/src/production/ProductionRenderer.tsx',
              'frontend/src/recovered/features/conversation/workspace/acknowledgement.ts',
              'frontend/src/recovered/features/conversation/workspace/chat-header.tsx',
              'frontend/src/recovered/features/conversation/workspace/model.ts',
              'frontend/src/recovered/features/conversation/workspace/submission-receipt.ts',
              'frontend/src/recovered/features/conversation/workspace/submission.ts',
              'frontend/src/recovered/features/conversation/workspace/transcript.tsx',
              'tests/composer-submission-queue.test.mjs',
              'tests/honeyline-message-lifecycle.test.mjs',
              'tests/honeyline-theme.test.mjs',
              'tests/honeyline-work-state.test.mjs',
              'tests/submission-receipt.test.mjs',
          }
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(target)], text=True)
          paths = {line.split('\t', 2)[2] for line in stats.splitlines()}
          assert paths == allowed, 'Unexpected patch paths'
          subprocess.run(['git', 'apply', '--index', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', '--index', str(target)], check=True)
          manifest = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sorted(paths)}
          pathlib.Path('/tmp/honeyline-evidence/source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(chat): preserve send order, uncertain receipts and stable Honeyline feedback'
          git rev-parse HEAD > /tmp/honeyline-evidence/verified-commit.txt
          git show --stat --oneline HEAD > /tmp/honeyline-evidence/changes.txt
      - name: Install locked dependencies
        run: set -o pipefail; npm ci --no-audit --no-fund 2>&1 | tee /tmp/honeyline-evidence/install.log
      - name: Hydrate the checksum-pinned runtime
        run: set -o pipefail; npm run bootstrap 2>&1 | tee /tmp/honeyline-evidence/bootstrap.log
      - name: Generate the owned macOS icon
        run: set -o pipefail; npm run icon:generate 2>&1 | tee /tmp/honeyline-evidence/icon.log
      - name: Run both typechecks and the complete test suite
        run: set -o pipefail; npm run check 2>&1 | tee /tmp/honeyline-evidence/check.log
      - name: Build the editable frontend
        run: set -o pipefail; npm run frontend:build 2>&1 | tee /tmp/honeyline-evidence/frontend-build.log
      - name: Verify the publication tree
        run: set -o pipefail; npm run publication:check 2>&1 | tee /tmp/honeyline-evidence/publication.log
      - name: Publish only the verified source commit, without rewriting history
        run: git push origin HEAD:refs/heads/fix/honeyline-send-feedback-20260922
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: honeyline-reliability-verification
          path: /tmp/honeyline-evidence/
          retention-days: 7
