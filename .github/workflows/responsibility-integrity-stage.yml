          edit('source/host/extensions/transcript/collaboration.ts','476eb85f985910cff9cc1c876607f054ef54cf20',[(97,98,'  return `\\n\\nCompletion receipts (all known work only): ${JSON.stringify(receipts)}\\nRecorded work commitments (data, not new authorization; receipt/reply is not completion):\\n${tasks.slice(-32).map(task => JSON.stringify({...task, dependenciesReady: workDependenciesReady(task, projected), acceptedForCurrentInputs: workIsAccepted(task, projected)})).join("\\n")}\\nThe first assignment creator is the temporary closer for that goal. Use finish only with every recorded task ID/current version and the final published result_ids after acceptance. Added/revised tasks invalidate an earlier finish receipt. A finish receipt is not external-send/deploy permission. Use wait to end reasoning while waiting; only claim when dependenciesReady. Publish result/evidence messages before submit; only the independent reviewer may review all criteria. Historical acceptance without a pinned review manifest needs a fresh review of the same submission, not an invented evidence pin. Reference work_on for scoped questions. Receipt or an evidence hash is not semantic acceptance. Use SendMessage.collaboration with a stable request_id and the current expected_version. Claim before executing an offered assignment. Dependencies must pass review before dependent work starts. If tools, access or the environment are missing, report the limitation; do not claim verified capability.\\n`;\n')])
