name: Quoted collaboration source
on:
  push:
    branches: [chore/continuity-dev-snapshot-20260922]
    paths: [.github/workflows/quote-context-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccb44556ed97a1298492f7005a5518b085f315ab
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Export tracked source and history only
        run: |
          mkdir /tmp/quote-source
          git bundle create /tmp/quote-source/source.bundle HEAD
          git rev-parse HEAD > /tmp/quote-source/commit.txt
          sha256sum /tmp/quote-source/source.bundle > /tmp/quote-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: quote-collaboration-source
          path: /tmp/quote-source/
          retention-days: 1
