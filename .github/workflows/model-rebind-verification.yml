name: model rebind and chat density verification
on:
  push:
    branches: [work/model-rebind-verification-20260925]
    paths: [.github/workflows/model-rebind-verification.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 47b34efc133084528ccba44ac84783b88183252b
          persist-credentials: false
      - name: Validate and materialize the exact reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,hashlib,lzma,pathlib,subprocess,os
          chunks=['44b69abdad2cfb84a09a548d421e53283f0beb1d','05c974c10f89ceab32e869e297e178b7194612f1','a3e183811cc30ee8c450af110cb97e66c40a92b2','706a03886dec74b1d3ca7e7ca335324a73cca7ca']
          payload=bytearray()
          for sha in chunks:
              req=urllib.request.Request('https://api.github.com/repos/yongchaoyin/beebot/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              data=base64.b64decode(json.load(urllib.request.urlopen(req,timeout=30))['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              payload.extend(data)
          assert hashlib.sha256(payload).hexdigest()=='60b0309041fd41d7ac12e9a6b58c561b9503044dfbc655fac70aa906fba7f3e1'
          patch=lzma.decompress(payload)
          assert hashlib.sha256(patch).hexdigest()=='98b03083e52b92e0953e34d4234d8d0fee73c22618a8d220170db5fcd889c7c5'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'model-rebind-candidate';out.mkdir()
          (out/'source.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index',str(out/'source.patch')],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')[:-1]
          assert len(paths)==14
          assert all(p.startswith(('source/','frontend/src/','scripts/','tests/','docs/implementation/')) and '..' not in p.split('/') for p in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          assert tree=='43b7176a12c688170997a9c3860423712f6e836f'
          (out/'tree.txt').write_text(tree+'\n')
          (out/'source-sha256.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          print('Verified',len(paths),'source files; tree:',tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-rebind-reviewed-source
          path: ${{ runner.temp }}/model-rebind-candidate/
          retention-days: 7
          if-no-files-found: error
  macos:
    needs: source
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 47b34efc133084528ccba44ac84783b88183252b
          lfs: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: model-rebind-reviewed-source
          path: ${{ runner.temp }}/model-rebind-candidate
      - name: Preserve candidate identity for clean export validation
        run: |
          git apply --index "$RUNNER_TEMP/model-rebind-candidate/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/model-rebind-candidate/tree.txt")"
          git -c user.name='BeeBot verification' -c user.email='verification@localhost' commit -m 'Local-only exact model rebind and conversation density candidate'
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap
      - run: npm run icon:generate
      - name: Full source, actual roster contract and shipped renderer regressions
        run: |
          set -o pipefail
          npm run check 2>&1 | tee model-rebind-tests.log
      - name: Build editable frontend
        run: npm run frontend:build
      - name: Verify native caption and window interactions remain intact
        run: |
          set -o pipefail
          node scripts/verify-native-window-layout.mjs 2>&1 | tee model-rebind-native.log
      - name: Verify product identity
        run: node scripts/audit-product-identity.mjs --json model-rebind-identity.json
      - run: npm run publication:check
      - name: Build and verify the actual BeeBot application
        run: |
          set -o pipefail
          node scripts/package-macos.mjs 2>&1 | tee model-rebind-package.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-rebind-macos-evidence
          include-hidden-files: true
          path: |
            model-rebind-tests.log
            model-rebind-native.log
            model-rebind-identity.json
            model-rebind-package.log
            .build/window-verification/native-window-report.json
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: [source, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 47b34efc133084528ccba44ac84783b88183252b
      - uses: actions/download-artifact@v4
        with:
          name: model-rebind-reviewed-source
          path: ${{ runner.temp }}/model-rebind-candidate
      - name: Publish verified code, tests and docs on a new review branch only
        run: |
          git apply --index "$RUNNER_TEMP/model-rebind-candidate/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/model-rebind-candidate/tree.txt")"
          test -z "$(git ls-remote --heads origin fix/model-rebind-chat-density-20260925)"
          git -c user.name='yongchaoyin' -c user.email='151381126+yongchaoyin@users.noreply.github.com' commit -m 'fix: repair shipped Bot model binding and tighten conversation layout'
          git push origin HEAD:refs/heads/fix/model-rebind-chat-density-20260925
          git rev-parse HEAD HEAD^{tree}
