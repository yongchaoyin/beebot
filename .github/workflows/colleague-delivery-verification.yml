name: colleague conversation delivery verification
on:
  push:
    branches: [work/colleague-delivery-verification-20260925]
    paths: [.github/workflows/colleague-delivery-verification.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db2745d87d0838df806b716d406cb18f63cec4db
          persist-credentials: false
      - name: Verify and materialize the exact reviewed source candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,hashlib,lzma,pathlib,subprocess,os
          shas=['aaa150d0efda0bb964328ddf95e3642839ff84bd','e27cff37876fb64a8a2eb0c23303a3ac21674e70']
          payload=bytearray()
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/yongchaoyin/beebot/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              chunk=base64.b64decode(json.load(urllib.request.urlopen(req,timeout=30))['content'])
              assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha
              payload.extend(chunk)
          assert hashlib.sha256(payload).hexdigest()=='d8ffeaacadc4831df19d119661ecebd6f5c257429bd2c7197ffbb40c4fec4d05'
          patch=lzma.decompress(payload)
          assert hashlib.sha256(patch).hexdigest()=='3149e609a0a8e20d834d790bd0a9ffad5c1db01ec5adc321395c71b04aac53f9'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'colleague-source';out.mkdir()
          (out/'source.patch').write_bytes(patch)
          subprocess.run(['git','apply','--unidiff-zero','--index',str(out/'source.patch')],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')[:-1]
          assert len(paths)==14
          assert all((p=='AGENTS.md' or p.startswith(('source/','tests/','docs/implementation/'))) and '..' not in p.split('/') for p in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          assert tree=='bd59e46f5d5ac03e49a54d1485b9ba86778300f9'
          (out/'tree.txt').write_text(tree+'\n')
          (out/'source-sha256.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          print('Verified',len(paths),'source files; tree:',tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: colleague-reviewed-source
          path: ${{ runner.temp }}/colleague-source/
          retention-days: 7
          if-no-files-found: error
  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db2745d87d0838df806b716d406cb18f63cec4db
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: colleague-reviewed-source
          path: ${{ runner.temp }}/colleague-source
      - run: |
          git apply --unidiff-zero --index "$RUNNER_TEMP/colleague-source/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/colleague-source/tree.txt")"
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check types and actual provider delivery boundaries
        run: |
          set -o pipefail
          npm run source:typecheck
          npm run typecheck
          node --test tests/provider-delivery-boundary.test.mjs tests/http-tool-parameters.test.mjs 2>&1 | tee colleague-linux-provider.log
      - run: npm run node:build
      - name: Exercise complete real Host and Shell integration suite
        env:
          BEEBOT_RUNTIME_INTEGRATION: '1'
        run: |
          set -o pipefail
          node --test tests/node-runtime.test.mjs 2>&1 | tee colleague-linux-host.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colleague-linux-evidence
          path: |
            colleague-linux-provider.log
            colleague-linux-host.log
          retention-days: 7
          if-no-files-found: warn
  macos:
    needs: source
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db2745d87d0838df806b716d406cb18f63cec4db
          lfs: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: colleague-reviewed-source
          path: ${{ runner.temp }}/colleague-source
      - name: Preserve exact candidate for clean publication verification
        run: |
          git apply --unidiff-zero --index "$RUNNER_TEMP/colleague-source/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/colleague-source/tree.txt")"
          git -c user.name='BeeBot verification' -c user.email='verification@localhost' commit -m 'Local-only colleague conversation and delivery verification'
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap
      - run: npm run icon:generate
      - name: Full source and actual renderer regressions
        run: |
          set -o pipefail
          npm run check 2>&1 | tee colleague-macos-tests.log
      - run: npm run frontend:build
      - name: Retain native caption and window interaction checks
        run: |
          set -o pipefail
          node scripts/verify-native-window-layout.mjs 2>&1 | tee colleague-native.log
      - run: node scripts/audit-product-identity.mjs --json colleague-identity.json
      - run: npm run publication:check
      - run: npm run node:build
      - name: Exercise persistent conversation and actual task delivery in Host
        env:
          BEEBOT_RUNTIME_INTEGRATION: '1'
        run: |
          set -o pipefail
          node --test --test-name-pattern='real HTTP Host separates' tests/node-runtime.test.mjs 2>&1 | tee colleague-macos-host.log
      - name: Build and verify actual BeeBot application
        run: |
          set -o pipefail
          node scripts/package-macos.mjs 2>&1 | tee colleague-package.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colleague-macos-evidence
          include-hidden-files: true
          path: |
            colleague-macos-tests.log
            colleague-macos-host.log
            colleague-native.log
            colleague-package.log
            colleague-identity.json
            .build/window-verification/native-window-report.json
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: [source,linux,macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db2745d87d0838df806b716d406cb18f63cec4db
      - uses: actions/download-artifact@v4
        with:
          name: colleague-reviewed-source
          path: ${{ runner.temp }}/colleague-source
      - name: Publish tested source, tests and docs to a new feature branch only
        run: |
          git apply --unidiff-zero --index "$RUNNER_TEMP/colleague-source/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/colleague-source/tree.txt")"
          test -z "$(git ls-remote --heads origin fix/colleague-conversation-delivery-20260925)"
          git -c user.name='yongchaoyin' -c user.email='151381126+yongchaoyin@users.noreply.github.com' commit -m 'fix(agent): keep private completions private and distinguish dialogue from work delivery'
          git push origin HEAD:refs/heads/fix/colleague-conversation-delivery-20260925
          git rev-parse HEAD HEAD^{tree}
