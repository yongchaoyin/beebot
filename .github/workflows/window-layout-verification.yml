name: window layout verification
on:
  push:
    branches: [work/window-layout-verification-20260924]
    paths: [.github/workflows/window-layout-verification.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29920ee0543c697a23ee7bcec2a61bbf7f75061f
          persist-credentials: false
      - name: Verify exact base patch and source supplement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,hashlib,lzma,pathlib,subprocess,os
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'window-candidate';out.mkdir()
          for index,(sha,digest) in enumerate([('589dff6e1326d4e74e69958ad478b6190cb3ef03','e9918c0b09c013555c2afbe7ed3e06a5dd30a618706dcfe56eccfacd7b9bff45'),('084544c9279dd03dc656828e614af91f352e4fe3','3b0df070ed48d031d2df9648cd24f4a725411b1cfe7932ce3fe4a0bd325d55c0')]):
              req=urllib.request.Request('https://api.github.com/repos/yongchaoyin/beebot/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              payload=base64.b64decode(json.load(urllib.request.urlopen(req,timeout=30))['content'])
              assert hashlib.sha1(b'blob '+str(len(payload)).encode()+b'\0'+payload).hexdigest()==sha
              assert hashlib.sha256(payload).hexdigest()==digest
              patch=pathlib.Path(os.environ['RUNNER_TEMP'])/('source-part-'+str(index)+'.patch');patch.write_bytes(lzma.decompress(payload))
              subprocess.run(['git','apply','--index',str(patch)],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')[:-1]
          assert len(paths)==14
          assert all((p.startswith(('source/','frontend/src/','scripts/','tests/','docs/implementation/')) or p=='.github/workflows/check.yml') and '..' not in p.split('/') for p in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          (out/'source.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary','--full-index']))
          (out/'source-sha256.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          (out/'tree.txt').write_text(subprocess.check_output(['git','write-tree']).decode())
          print('Verified source files:',len(paths),'tree:',(out/'tree.txt').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: window-layout-candidate
          path: ${{ runner.temp }}/window-candidate/
          retention-days: 3
          if-no-files-found: error
  macos:
    needs: source
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29920ee0543c697a23ee7bcec2a61bbf7f75061f
          lfs: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: window-layout-candidate
          path: ${{ runner.temp }}/window-candidate
      - name: Preserve candidate identity for clean export validation
        run: |
          git apply --index "$RUNNER_TEMP/window-candidate/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/window-candidate/tree.txt")"
          git -c user.name='BeeBot verification' -c user.email='verification@localhost' commit -m 'Local-only final caption and window layout verification'
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap
      - run: npm run icon:generate
      - name: Exercise real native geometry, clicks, zoom and fullscreen
        run: |
          set -o pipefail
          node scripts/verify-native-window-layout.mjs 2>&1 | tee window-native.log
      - name: Complete repository regression and type checks
        run: |
          set -o pipefail
          npm run check 2>&1 | tee window-tests.log
      - run: npm run frontend:build
      - run: npm run publication:check
      - name: Build and verify actual BeeBot package
        run: |
          set -o pipefail
          node scripts/package-macos.mjs 2>&1 | tee window-package.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-layout-macos-evidence
          path: |
            window-native.log
            window-tests.log
            window-package.log
            .build/window-verification/native-window-report.json
            .build/window-verification/native-content-windowed.png
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
  candidate:
    needs: [source,macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29920ee0543c697a23ee7bcec2a61bbf7f75061f
      - uses: actions/download-artifact@v4
        with:
          name: window-layout-candidate
          path: ${{ runner.temp }}/window-candidate
      - name: Publish tested source and docs without changing other branches
        run: |
          git apply --index "$RUNNER_TEMP/window-candidate/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/window-candidate/tree.txt")"
          test -z "$(git ls-remote --heads origin fix/window-layout-safety-20260924)"
          git -c user.name='yongchaoyin' -c user.email='151381126+yongchaoyin@users.noreply.github.com' commit -m 'fix(ui): reserve native caption space and prevent layout clipping'
          git push origin HEAD:refs/heads/fix/window-layout-safety-20260924
          git rev-parse HEAD HEAD^{tree}
