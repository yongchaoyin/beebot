name: Quoted reply runtime stage
on:
  push:
    branches: [chore/continuity-dev-snapshot-20260922]
    paths: [.github/workflows/quote-runtime-stage.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccb44556ed97a1298492f7005a5518b085f315ab
          fetch-depth: 0
          lfs: false
      - name: Apply exact reviewed source patch and commit object
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,subprocess,zlib
          payload=''''''
          raw=base64.b64decode(payload)
          assert hashlib.sha256(raw).hexdigest() == 'f5815c0b8514b9d51b24e41c5b18fc46e1a0f47c064d21106af8a1e6a6b337ee'
          stage=json.loads(zlib.decompress(raw))
          def git(*args,data=None): return subprocess.check_output(['git',*args],input=data)
          parent='ccb44556ed97a1298492f7005a5518b085f315ab'
          assert git('rev-parse','HEAD').decode().strip()==parent
          patch=stage['patch'].encode();git('apply','--check','--index','--unidiff-zero',data=patch);git('apply','--index','--unidiff-zero',data=patch)
          tree=git('write-tree').decode().strip();assert tree=='88f7520d3268612ae7b0dd52158f379ddc4551b9'
          raw_commit=stage['commit'].encode();assert raw_commit.startswith(('tree '+tree+'\nparent '+parent+'\n').encode())
          sha=git('hash-object','-t','commit','-w','--stdin',data=raw_commit).decode().strip();assert sha=='94ddbff8d0d1dff59f679a8c1b6839d027fd84dd'
          git('update-ref','HEAD',sha,parent)
          git('push','origin','HEAD:refs/heads/chore/quoted-stage-candidate-20260922')
          print('Verified exact source commit:',sha)
          PY
