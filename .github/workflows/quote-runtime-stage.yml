name: Quoted reply runtime stage
on:
  push:
    branches: [chore/continuity-dev-snapshot-20260922]
    paths: [.github/workflows/quote-runtime-stage.yml, '.dev-submit/quoted-runtime-*']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Verify exact reviewed patch and source tree
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zlib
          raw=b''.join(pathlib.Path(f'.dev-submit/quoted-runtime-{i}.bin').read_bytes() for i in range(4))
          assert len(raw)==11721
          assert hashlib.sha256(raw).hexdigest()=='f5815c0b8514b9d51b24e41c5b18fc46e1a0f47c064d21106af8a1e6a6b337ee'
          stage=json.loads(zlib.decompress(raw))
          def git(*args,data=None):return subprocess.check_output(['git',*args],input=data)
          parent='ccb44556ed97a1298492f7005a5518b085f315ab'
          git('checkout','--detach',parent)
          patch=stage['patch'].encode()
          git('apply','--check','--index','--unidiff-zero',data=patch)
          git('apply','--index','--unidiff-zero',data=patch)
          for name in filter(None,git('diff','--cached','--name-only','-z').decode().split('\0')):
              assert name.startswith(('source/','tests/','docs/')),name
          tree=git('write-tree').decode().strip()
          assert tree=='88f7520d3268612ae7b0dd52158f379ddc4551b9'
          commit=stage['commit'].encode()
          assert commit.startswith(('tree '+tree+'\nparent '+parent+'\n').encode())
          sha=git('hash-object','-t','commit','-w','--stdin',data=commit).decode().strip()
          assert sha=='94ddbff8d0d1dff59f679a8c1b6839d027fd84dd'
          git('update-ref','HEAD',sha,parent)
          assert not git('status','--porcelain').strip()
          git('push','origin','HEAD:refs/heads/chore/quoted-stage-candidate-20260922')
          print('Verified exact source commit:',sha)
          PY
