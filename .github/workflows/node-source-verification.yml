name: node source verification
on:
  push:
    branches: [work/node-ssh-verification-20260922]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7fab604ebbc926150e64964c0d79aeb2d3860acf
          persist-credentials: false
      - name: Export only the reviewed source baseline
        run: |
          git archive --format=tar.gz HEAD > beebot-source.tar.gz
          sha256sum beebot-source.tar.gz > beebot-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: node-source-7fab604
          path: |
            beebot-source.tar.gz
            beebot-source.sha256
          retention-days: 2
          if-no-files-found: error
