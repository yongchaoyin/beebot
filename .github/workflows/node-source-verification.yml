name: node source verification
on:
  push:
    branches: [work/node-ssh-verification-20260922]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7fab604ebbc926150e64964c0d79aeb2d3860acf
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export supplemental packages and public SSH test executables
        run: |
          mkdir -p verification-tooling/bin verification-tooling/lib
          tar -czf verification-tooling/supplemental.tar.gz node_modules/@jimp node_modules/pdfjs-dist
          for f in /usr/bin/ssh /usr/bin/ssh-keyscan /usr/bin/ssh-keygen; do
            cp "$f" verification-tooling/bin/
            ldd "$f" | awk '/=> \/.* \(/ {print $3}' | while read -r lib; do cp "$lib" verification-tooling/lib/; done
          done
          cd verification-tooling
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: node-linux-supplemental-tools
          path: verification-tooling/
          retention-days: 2
          if-no-files-found: error
