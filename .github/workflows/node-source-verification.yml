name: node source verification
on:
  push:
    branches: [work/node-ssh-verification-20260922]
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7fab604ebbc926150e64964c0d79aeb2d3860acf
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - name: Install locked packages without running platform install hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export a Linux-only verification toolchain, not a release
        run: |
          mkdir verification-tooling
          cp "$(command -v node)" verification-tooling/node
          tar --exclude='node_modules/electron' --exclude='node_modules/@jimp' --exclude='node_modules/pdfjs-dist' -czf verification-tooling/dependencies.tar.gz node_modules
          cd verification-tooling
          sha256sum node dependencies.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: node-linux-verification-tooling
          path: verification-tooling/
          retention-days: 2
          if-no-files-found: error
