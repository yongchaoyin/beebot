name: model and branding verification
on:
  push:
    branches: [work/model-brand-verification-20260924]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6789c7ee736e612dca11f3a91f7830260eb1313b
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: model-brand-candidate
          run-id: 36002311535
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-candidate
      - name: Apply original candidate and hash-verified supplementary source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,hashlib,pathlib,subprocess,os
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);old=temp/'original-candidate'
          subprocess.run(['git','apply','--unidiff-zero','--index',str(old/'source.patch')],check=True)
          assert subprocess.check_output(['git','write-tree']).decode().strip()=='191be0ec6f7e2386e61a5dbdaf0c9bc95ee0b2a9'
          sha='ea28264f6f0a5f38b9b921f01f2d3228568be4ee'
          req=urllib.request.Request('https://api.github.com/repos/yongchaoyin/beebot/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          patch=base64.b64decode(json.load(urllib.request.urlopen(req,timeout=30))['content'])
          assert hashlib.sha1(b'blob '+str(len(patch)).encode()+b'\0'+patch).hexdigest()==sha
          assert hashlib.sha256(patch).hexdigest()=='33b45c519c7abdd43fce957e44b39105ee65855a85c2bea0ad066c8e726fda01'
          (temp/'supplement.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index',str(temp/'supplement.patch')],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')[:-1]
          assert len(paths)==55
          assert all(p.startswith(('source/','frontend/src/','scripts/','tests/','docs/implementation/')) and '..' not in p.split('/') for p in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          out=temp/'model-brand-final';out.mkdir()
          (out/'source.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary','--full-index']))
          (out/'source-sha256.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          (out/'tree.txt').write_text(subprocess.check_output(['git','write-tree']).decode())
          print('Validated',len(paths),'source paths. Tree:',(out/'tree.txt').read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-brand-final-candidate
          path: ${{ runner.temp }}/model-brand-final/
          retention-days: 3
          if-no-files-found: error
  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6789c7ee736e612dca11f3a91f7830260eb1313b
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: model-brand-final-candidate
          path: ${{ runner.temp }}/model-brand-final
      - run: |
          git apply --index "$RUNNER_TEMP/model-brand-final/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/model-brand-final/tree.txt")"
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and exercise model configuration handlers
        run: |
          set -o pipefail
          npm run source:typecheck
          npm run typecheck
          node --test tests/model-binding.test.mjs tests/model-binding-ui.test.mjs tests/sand-settings-store.test.mjs tests/resolve-inference.test.mjs tests/inference-vendor.test.mjs tests/application-menu.test.mjs | tee model-linux-tests.log
      - name: Verify real read-only Docker directory publication
        run: |
          docker pull node:26.5.0-bookworm-slim
          BEEBOT_MODEL_DOCKER_TEST=1 BEEBOT_TEST_NODE_IMAGE="$(docker image inspect --format '{{.Id}}' node:26.5.0-bookworm-slim)" BEEBOT_MODEL_DOCKER_REPORT=model-docker-report.json node scripts/verify-model-config-docker.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-final-linux-evidence
          path: |
            model-linux-tests.log
            model-docker-report.json
          retention-days: 3
          if-no-files-found: warn
  macos:
    needs: source
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6789c7ee736e612dca11f3a91f7830260eb1313b
          lfs: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: model-brand-final-candidate
          path: ${{ runner.temp }}/model-brand-final
      - name: Materialize exact candidate for publication validation
        run: |
          git apply --index "$RUNNER_TEMP/model-brand-final/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/model-brand-final/tree.txt")"
          git -c user.name='BeeBot verification' -c user.email='verification@localhost' commit -m 'Local-only final model binding and branding candidate'
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap
      - run: npm run icon:generate
      - name: Full source and actual renderer regressions
        run: |
          set -o pipefail
          npm run check 2>&1 | tee model-macos-tests.log
      - run: npm run frontend:build
      - run: npm run publication:check
      - name: Build and verify the complete rebranded app
        run: |
          set -o pipefail
          node scripts/package-macos.mjs 2>&1 | tee model-macos-package.log
      - name: Build a clean BeeBot installer
        run: node scripts/package-dmg.mjs
      - name: Verify mounted installer and native product names
        run: |
          python3 - <<'PY'
          import pathlib,tempfile,subprocess,json,os,plistlib
          mount=pathlib.Path(tempfile.mkdtemp(prefix='bb-installer-check-'));attached=False
          try:
              subprocess.run(['/usr/bin/hdiutil','attach','-nobrowse','-readonly','-mountpoint',str(mount),'dist/BeeBot.dmg'],check=True);attached=True
              names=sorted(p.name for p in mount.iterdir() if not p.name.startswith('.'))
              assert names==['Applications','BeeBot.app'],names
              assert (mount/'Applications').is_symlink() and os.readlink(mount/'Applications')=='/Applications'
              app=mount/'BeeBot.app'
              result=subprocess.check_output(['python3','scripts/lib/rebrand-macos.py',str(app),'--verify'],text=True)
              subprocess.run(['/usr/bin/codesign','--verify','--deep','--strict',str(app)],check=True)
              info=plistlib.loads((app/'Contents/Info.plist').read_bytes())
              pathlib.Path('macos-branding-report.json').write_text(json.dumps({'passed':True,'installerContents':names,'mainExecutable':info['CFBundleExecutable'],'bundleId':info['CFBundleIdentifier'],'bundleValidation':json.loads(result),'deepStrictSignature':True,'signing':'local ad-hoc, not notarized','scope':'build and mounted installer verification; no interactive installed user profile'},indent=2))
          finally:
              if attached:subprocess.run(['/usr/bin/hdiutil','detach',str(mount)],check=True)
              mount.rmdir()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-final-macos-evidence
          path: |
            model-macos-tests.log
            model-macos-package.log
            macos-branding-report.json
          retention-days: 3
          if-no-files-found: warn
  candidate:
    needs: [source,linux,macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6789c7ee736e612dca11f3a91f7830260eb1313b
      - uses: actions/download-artifact@v4
        with:
          name: model-brand-final-candidate
          path: ${{ runner.temp }}/model-brand-final
      - name: Publish tested code and docs to a new feature branch only
        run: |
          git apply --index "$RUNNER_TEMP/model-brand-final/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/model-brand-final/tree.txt")"
          test -z "$(git ls-remote --heads origin fix/model-binding-branding-20260924)"
          git -c user.name='yongchaoyin' -c user.email='151381126+yongchaoyin@users.noreply.github.com' commit -m 'fix: synchronize Bot model bindings and finish BeeBot product branding'
          git push origin HEAD:refs/heads/fix/model-binding-branding-20260924
          git rev-parse HEAD HEAD^{tree}
