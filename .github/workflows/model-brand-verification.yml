name: model and branding verification
on:
  push:
    branches: [work/model-brand-verification-20260924]
permissions:
  contents: read
jobs:
  reference:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6789c7ee736e612dca11f3a91f7830260eb1313b
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap
      - name: Export pinned renderer and bundle metadata for inspection
        run: |
          mkdir -p "$RUNNER_TEMP/branding-reference"
          tar -czf "$RUNNER_TEMP/branding-reference/renderer.tar.gz" src/app/dist/renderer
          python3 - <<'PY'
          import pathlib,plistlib,json,os
          root=pathlib.Path('.cache/runtime/Grok Bot.app')
          values={str(p.relative_to(root)):plistlib.loads(p.read_bytes()) for p in root.rglob('Info.plist')}
          pathlib.Path(os.environ['RUNNER_TEMP'],'branding-reference','bundle-info.json').write_text(json.dumps(values,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-branding-reference
          path: ${{ runner.temp }}/branding-reference/
          retention-days: 3
          if-no-files-found: error
