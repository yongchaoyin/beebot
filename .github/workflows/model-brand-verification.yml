name: model and branding verification
on:
  push:
    branches: [work/model-brand-verification-20260924]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6789c7ee736e612dca11f3a91f7830260eb1313b
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact baseline delta and file manifest
        run: |
          mkdir -p "$RUNNER_TEMP/model-brand-source"
          git diff --binary --full-index 7fab604ebbc926150e64964c0d79aeb2d3860acf HEAD > "$RUNNER_TEMP/model-brand-source/develop.patch"
          git ls-tree -rz HEAD > "$RUNNER_TEMP/model-brand-source/tree.manifest"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/model-brand-source/identity.txt"
          cd "$RUNNER_TEMP/model-brand-source"
          sha256sum develop.patch tree.manifest identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: develop-model-brand-source
          path: ${{ runner.temp }}/model-brand-source/
          retention-days: 3
          if-no-files-found: error
