name: presence expression verification
on:
  push:
    branches: [work/presence-expressions-verification-20260925]
    paths: [.github/workflows/presence-expressions-verification.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8491442ff6a751aa930175caf185eeffae32b98a
          persist-credentials: false
      - name: Reassemble exact source-only expression changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,hashlib,lzma,pathlib,subprocess,os
          shas=['103616d994bd3a0a06f24fc2489cb35e72d1e4e7','1a1e23bfa63398bfd140c8f4cc99bb1346a2b645','5be411951260f235b93df48049c8d02a2901f2c0','2242cabb8dc1283c626dc1469e08e61048712fa5']
          payload=bytearray()
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/yongchaoyin/beebot/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              chunk=base64.b64decode(json.load(urllib.request.urlopen(req,timeout=30))['content'])
              assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha
              payload.extend(chunk)
          assert hashlib.sha256(payload).hexdigest()=='122508858e4c2f69a59a171e8c115d12c1122daaeda3390854037eef09e98e8e'
          patch=lzma.decompress(payload)
          assert hashlib.sha256(patch).hexdigest()=='5e677b9c4e5d7a625d57a23b375950d0b609b91b28f673ce7c5cdef71364af6e'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'presence-source';out.mkdir()
          (out/'source.patch').write_bytes(patch)
          subprocess.run(['git','apply','--unidiff-zero','--index',str(out/'source.patch')],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')[:-1]
          assert len(paths)==20
          assert all(p.startswith(('frontend/src/','scripts/lib/','tests/','docs/implementation/')) and '..' not in p.split('/') for p in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          assert tree=='8e77cd930ccf23c238a230c29354bdb56dfab269'
          (out/'tree.txt').write_text(tree+'\n')
          (out/'source-sha256.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          print('Verified',len(paths),'files; tree:',tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: presence-reviewed-source
          path: ${{ runner.temp }}/presence-source/
          retention-days: 7
          if-no-files-found: error
  macos:
    needs: source
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8491442ff6a751aa930175caf185eeffae32b98a
          lfs: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: presence-reviewed-source
          path: ${{ runner.temp }}/presence-source
      - name: Preserve exact source tree for publication checks
        run: |
          git apply --unidiff-zero --index "$RUNNER_TEMP/presence-source/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/presence-source/tree.txt")"
          git -c user.name='BeeBot verification' -c user.email='verification@localhost' commit -m 'Local-only independent Presence expression candidate'
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap
      - run: npm run icon:generate
      - name: Full source, lifecycle, queue and actual renderer regression
        run: |
          set -o pipefail
          npm run check 2>&1 | tee presence-macos-tests.log
      - run: npm run frontend:build
      - name: Preserve native caption and window interaction checks
        run: |
          set -o pipefail
          node scripts/verify-native-window-layout.mjs 2>&1 | tee presence-native.log
      - run: node scripts/audit-product-identity.mjs --json presence-identity.json
      - run: npm run publication:check
      - name: Build and verify the actual BeeBot app
        run: |
          set -o pipefail
          node scripts/package-macos.mjs 2>&1 | tee presence-package.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presence-macos-evidence
          include-hidden-files: true
          path: |
            presence-macos-tests.log
            presence-native.log
            presence-package.log
            presence-identity.json
            .build/window-verification/native-window-report.json
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: [source,macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8491442ff6a751aa930175caf185eeffae32b98a
      - uses: actions/download-artifact@v4
        with:
          name: presence-reviewed-source
          path: ${{ runner.temp }}/presence-source
      - name: Publish tested code, tests and docs to a new feature branch
        run: |
          git apply --unidiff-zero --index "$RUNNER_TEMP/presence-source/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/presence-source/tree.txt")"
          test -z "$(git ls-remote --heads origin feat/presence-expressions-20260925)"
          git -c user.name='yongchaoyin' -c user.email='151381126+yongchaoyin@users.noreply.github.com' commit -m 'feat(presence): add independent expressions, natural motion and shared avatar previews'
          git push origin HEAD:refs/heads/feat/presence-expressions-20260925
          git rev-parse HEAD HEAD^{tree}
