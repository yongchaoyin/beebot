name: Commitment source snapshot
on:
  push:
    branches: [chore/continuity-dev-snapshot-20260922]
    paths: [.github/workflows/commitment-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 02be4fec11cd4eb01a8e9f3864eb359427784c44
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Export only tracked source and Git objects
        run: |
          mkdir -p /tmp/commitment-source
          git bundle create /tmp/commitment-source/source.bundle HEAD
          git rev-parse HEAD > /tmp/commitment-source/commit.txt
          sha256sum /tmp/commitment-source/source.bundle > /tmp/commitment-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: beebot-commitment-source
          path: /tmp/commitment-source/
          retention-days: 1
