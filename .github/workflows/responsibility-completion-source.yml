name: Responsibility completion source
on:
  push:
    branches: [chore/continuity-dev-snapshot-20260922]
    paths: [.github/workflows/responsibility-completion-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 81812eb13e23e433a33ed4cee1c71e018270ada8
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Export source history without credentials or repository config
        run: |
          mkdir /tmp/responsibility-source
          git bundle create /tmp/responsibility-source/source.bundle HEAD
          git rev-parse HEAD > /tmp/responsibility-source/commit.txt
          sha256sum /tmp/responsibility-source/source.bundle > /tmp/responsibility-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: responsibility-completion-source
          path: /tmp/responsibility-source/
          retention-days: 1
