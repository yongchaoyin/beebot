name: Presence native baseline
on:
  push:
    branches: [work/presence-validation-20260922]
    paths: [.github/workflows/presence-validation.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a11209cb1620e96470ec16363d8858b830592bcb
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap
      - name: Export pinned renderer for exact native adapters
        run: tar -czf /tmp/presence-native-renderer.tar.gz src/app/dist/renderer
      - uses: actions/upload-artifact@v4
        with:
          name: presence-native-baseline
          path: /tmp/presence-native-renderer.tar.gz
          retention-days: 1
