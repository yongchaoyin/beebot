name: Work understanding source
on:
  push:
    branches: [work/natural-collaboration-validation-20260922]
    paths: [.github/workflows/work-understanding-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 76a99d4b1fd14782e04945c8cbe9abe96eb25d8d
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - name: Export source history without checkout credentials
        run: |
          mkdir /tmp/work-understanding-source
          git bundle create /tmp/work-understanding-source/source.bundle HEAD
          git rev-parse HEAD > /tmp/work-understanding-source/commit.txt
          sha256sum /tmp/work-understanding-source/source.bundle > /tmp/work-understanding-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: work-understanding-source
          path: /tmp/work-understanding-source/
          retention-days: 1
