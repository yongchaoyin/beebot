name: task security verification
on:
  push:
    branches: [work/task-security-verification-20260923]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5fffdd773141970778f5fcf7df8f24fe59a8113f
          persist-credentials: false
      - name: Verify and apply the exact reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,hashlib,lzma,pathlib,subprocess,os
          shas=['05212e9a302d0ac29ae32756220b79035f872acd','7091a5b0e516a719ed1ea81da351cd587d9c858a','0b45d9bcb2576fedee7a2d06acf6aa0b4caffa6d','66b02c905beaac8fe15e082ba38b523baacc5a31']
          payload=bytearray()
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/yongchaoyin/beebot/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as res: data=json.load(res)
              chunk=base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha
              payload.extend(chunk)
          assert hashlib.sha256(payload).hexdigest()=='203bd3c38593752ecf48d1541bce1a00b35bb9ca3bb93238810e02aec1b2bbbd'
          patch=lzma.decompress(payload)
          assert hashlib.sha256(patch).hexdigest()=='59825b096b8b46d6caae1b47cc3e12c7b2cd9aea149d7d2983675114ca83d458'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'task-safety';out.mkdir()
          (out/'source.patch').write_bytes(patch)
          subprocess.run(['git','apply','--unidiff-zero','--index',str(out/'source.patch')],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')[:-1]
          assert len(paths)==21
          assert all(p.startswith(('source/','frontend/src/','scripts/lib/','tests/','docs/implementation/')) and '..' not in p.split('/') for p in paths)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          assert tree=='86b0b90bd27d34dc574bb784ea60777f5bc11c46'
          manifest={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}
          (out/'source-sha256.json').write_text(json.dumps(manifest,indent=2))
          (out/'tree.txt').write_text(tree+'\n')
          print('Verified source files:',len(paths)); print('Exact tree:',tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: task-safety-reviewed-source
          path: ${{ runner.temp }}/task-safety/
          retention-days: 3
          if-no-files-found: error
  linux:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5fffdd773141970778f5fcf7df8f24fe59a8113f
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: task-safety-reviewed-source
          path: ${{ runner.temp }}/task-safety
      - name: Materialize the reviewed source tree
        run: |
          git apply --unidiff-zero --index "$RUNNER_TEMP/task-safety/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/task-safety/tree.txt")"
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/task-safety/source-sha256.json" "$RUNNER_TEMP/evidence/"
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check both type systems and every Node test
        shell: bash
        run: |
          set -euo pipefail
          npm run source:typecheck
          npm run typecheck
          node --test tests/node-*.test.mjs 2>&1 | tee "$RUNNER_TEMP/evidence/node-tests.log"
      - name: Build the real standalone runtime and native bindings
        run: |
          node scripts/apply-third-party-patches.mjs
          node node_modules/node-gyp/bin/node-gyp.js rebuild --directory node_modules/tree-sitter --release
          node node_modules/node-gyp/bin/node-gyp.js rebuild --directory node_modules/tree-sitter-bash --release
          npm run node:build
      - name: Real Host, Shell, security stop, restart and CLI regression
        shell: bash
        run: |
          set -euo pipefail
          BEEBOT_RUNTIME_INTEGRATION=1 node --test --test-concurrency=1 tests/node-runtime.test.mjs tests/node-e2e.test.mjs tests/node-task-security-runtime.test.mjs 2>&1 | tee "$RUNNER_TEMP/evidence/real-runtime.log"
          node scripts/smoke-node-service.mjs 2>&1 | tee "$RUNNER_TEMP/evidence/cli-smoke.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-safety-linux-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 3
          if-no-files-found: error
  macos:
    needs: source
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5fffdd773141970778f5fcf7df8f24fe59a8113f
          lfs: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: task-safety-reviewed-source
          path: ${{ runner.temp }}/task-safety
      - name: Materialize source for lossless publication validation
        run: |
          git apply --unidiff-zero --index "$RUNNER_TEMP/task-safety/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/task-safety/tree.txt")"
          git -c user.name='BeeBot verification' -c user.email='verification@localhost' commit -m 'Local-only task safety source verification'
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/task-safety/source-sha256.json" "$RUNNER_TEMP/evidence/"
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap
      - run: npm run icon:generate
      - name: Full source and packaged renderer regression
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/evidence/full-check.log"
          npm run frontend:build 2>&1 | tee "$RUNNER_TEMP/evidence/frontend-build.log"
          npm run publication:check 2>&1 | tee "$RUNNER_TEMP/evidence/publication.log"
      - name: Build real standalone runtime
        run: |
          node node_modules/node-gyp/bin/node-gyp.js rebuild --directory node_modules/tree-sitter --release
          node node_modules/node-gyp/bin/node-gyp.js rebuild --directory node_modules/tree-sitter-bash --release
          npm run node:build
      - name: Real Host, Shell, security stop, restart and CLI regression
        shell: bash
        run: |
          set -euo pipefail
          BEEBOT_RUNTIME_INTEGRATION=1 node --test --test-concurrency=1 tests/node-runtime.test.mjs tests/node-e2e.test.mjs tests/node-task-security-runtime.test.mjs 2>&1 | tee "$RUNNER_TEMP/evidence/real-runtime.log"
          node scripts/smoke-node-service.mjs 2>&1 | tee "$RUNNER_TEMP/evidence/cli-smoke.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-safety-macos-evidence
          path: ${{ runner.temp }}/evidence/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: [source, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5fffdd773141970778f5fcf7df8f24fe59a8113f
      - uses: actions/download-artifact@v4
        with:
          name: task-safety-reviewed-source
          path: ${{ runner.temp }}/task-safety
      - name: Publish only tested source to a new feature branch
        run: |
          git apply --unidiff-zero --index "$RUNNER_TEMP/task-safety/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/task-safety/tree.txt")"
          test -z "$(git ls-remote --heads origin feat/node-task-safety-20260923)"
          git -c user.name='yongchaoyin' -c user.email='151381126+yongchaoyin@users.noreply.github.com' commit -m 'feat(security): bind accepted tasks to devices and persist safety freezes'
          git push origin HEAD:refs/heads/feat/node-task-safety-20260923
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
