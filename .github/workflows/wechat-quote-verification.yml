name: quoted reply presentation verification
on:
  push:
    branches: [work/wechat-quote-verification-20260925]
    paths: [.github/workflows/wechat-quote-verification.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2df001f398d0068f974ce7ef936b9e6538fca4c1
          persist-credentials: false
      - name: Materialize hash-verified source patch without generated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,hashlib,lzma,pathlib,subprocess,os
          payload=bytearray()
          for sha in ['11523e3df5c993fd840a8fe2a4dd849b374152a2','bd2cd6c7c58aec164ca78ae66390a206d873f9ce']:
              request=urllib.request.Request('https://api.github.com/repos/yongchaoyin/beebot/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              chunk=base64.b64decode(json.load(urllib.request.urlopen(request,timeout=30))['content'])
              assert hashlib.sha1(b'blob '+str(len(chunk)).encode()+b'\0'+chunk).hexdigest()==sha
              payload.extend(chunk)
          assert hashlib.sha256(payload).hexdigest()=='35e9aae7b0f7da64733a74e5b70491ed5d1fcbead94d3cfa0e8469bef8637558'
          patch=lzma.decompress(payload)
          assert hashlib.sha256(patch).hexdigest()=='4c0ea88c63c5f588df8db7c693bb0f8b64be9b30ad2b85b8bc68e76ee70f79f5'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'wechat-quote-source';out.mkdir()
          (out/'source.patch').write_bytes(patch)
          subprocess.run(['git','apply','--unidiff-zero','--index',str(out/'source.patch')],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')[:-1]
          assert len(paths)==13
          assert all(p.startswith(('frontend/src/','scripts/lib/','tests/','docs/implementation/')) and '..' not in p.split('/') for p in paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=subprocess.check_output(['git','write-tree']).decode().strip()
          assert tree=='9b3eddcddae666c7f368b7314a07b49dad4c30f1'
          (out/'tree.txt').write_text(tree+'\n')
          (out/'source-sha256.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          print('Verified',len(paths),'source files; tree:',tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-quote-reviewed-source
          path: ${{ runner.temp }}/wechat-quote-source/
          retention-days: 7
          if-no-files-found: error
  macos:
    needs: source
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2df001f398d0068f974ce7ef936b9e6538fca4c1
          lfs: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wechat-quote-reviewed-source
          path: ${{ runner.temp }}/wechat-quote-source
      - name: Preserve exact candidate identity for clean-tree validation
        run: |
          git apply --unidiff-zero --index "$RUNNER_TEMP/wechat-quote-source/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/wechat-quote-source/tree.txt")"
          git -c user.name='BeeBot verification' -c user.email='verification@localhost' commit -m 'Local-only WeChat-style quoted reply candidate'
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap
      - run: npm run icon:generate
      - name: Full source and actual shipped renderer regressions
        run: |
          set -o pipefail
          npm run check 2>&1 | tee wechat-quote-tests.log
      - run: npm run frontend:build
      - name: Preserve native window safety and interaction checks
        run: |
          set -o pipefail
          node scripts/verify-native-window-layout.mjs 2>&1 | tee wechat-quote-native.log
      - run: node scripts/audit-product-identity.mjs --json wechat-quote-identity.json
      - run: npm run publication:check
      - name: Build and verify actual BeeBot application
        run: |
          set -o pipefail
          node scripts/package-macos.mjs 2>&1 | tee wechat-quote-package.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-quote-macos-evidence
          include-hidden-files: true
          path: |
            wechat-quote-tests.log
            wechat-quote-native.log
            wechat-quote-package.log
            wechat-quote-identity.json
            .build/window-verification/native-window-report.json
          retention-days: 7
          if-no-files-found: warn
  publish:
    needs: [source,macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2df001f398d0068f974ce7ef936b9e6538fca4c1
      - uses: actions/download-artifact@v4
        with:
          name: wechat-quote-reviewed-source
          path: ${{ runner.temp }}/wechat-quote-source
      - name: Commit verified code, tests and docs on a new feature branch only
        run: |
          git apply --unidiff-zero --index "$RUNNER_TEMP/wechat-quote-source/source.patch"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/wechat-quote-source/tree.txt")"
          test -z "$(git ls-remote --heads origin fix/wechat-quote-ux-20260925)"
          git -c user.name='yongchaoyin' -c user.email='151381126+yongchaoyin@users.noreply.github.com' commit -m 'fix(chat): use compact WeChat-style quotes below reply bubbles'
          git push origin HEAD:refs/heads/fix/wechat-quote-ux-20260925
          git rev-parse HEAD HEAD^{tree}
