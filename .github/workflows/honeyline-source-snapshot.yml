name: Honeyline development source snapshot
on:
  push:
    branches: [work/honeyline-reliability-snapshot-20260922]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8bd4703edf0e75196d308b31b5b3c4ea9e34d74
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - name: Install exact dependencies for isolated Linux frontend validation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export dependencies and pinned Node, never credentials or configuration
        run: |
          cp "$(command -v node)" "$RUNNER_TEMP/node-26.5.0"
          tar -czf "$RUNNER_TEMP/beebot-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: honeyline-linux-validation-toolchain
          path: |
            ${{ runner.temp }}/beebot-dependencies.tar.gz
            ${{ runner.temp }}/node-26.5.0
          retention-days: 1
