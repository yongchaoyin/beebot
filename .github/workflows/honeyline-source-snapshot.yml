name: Honeyline source snapshot
on:
  push:
    branches: [fix/honeyline-reliability-20260922]
    paths: [.github/workflows/honeyline-source-snapshot.yml]
permissions:
  contents: read
jobs:
  renderer:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap
      - name: Archive verified renderer inputs
        run: tar -czf /tmp/honeyline-pinned-renderer.tar.gz src/app/dist/renderer
      - uses: actions/upload-artifact@v4
        with:
          name: honeyline-pinned-renderer
          path: /tmp/honeyline-pinned-renderer.tar.gz
          retention-days: 1
