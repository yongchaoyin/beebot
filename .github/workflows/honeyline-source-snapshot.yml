name: Honeyline source snapshot
on:
  push:
    branches: [fix/honeyline-reliability-20260922]
    paths: [.github/workflows/honeyline-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - name: Install locked compiler and component dependencies without application hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Archive local regression tools only
        run: |
          mkdir -p /tmp/honeyline-tools
          cp "$(command -v node)" /tmp/honeyline-tools/node
          tar -czf /tmp/honeyline-tools/node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: honeyline-locked-linux-tools
          path: /tmp/honeyline-tools/
          retention-days: 1
