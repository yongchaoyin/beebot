name: Honeyline source snapshot
on:
  push:
    branches: [fix/honeyline-reliability-20260922]
    paths: [.github/workflows/honeyline-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz -o /tmp/beebot-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: honeyline-tracked-source
          path: /tmp/beebot-source.tar.gz
          retention-days: 1
