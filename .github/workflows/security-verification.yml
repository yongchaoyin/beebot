name: security verification
on:
  push:
    branches: [work/security-verification-20260923]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 183fd0bb11a78562177d8ee1197c72e5ba17a161
          fetch-depth: 0
          persist-credentials: false
      - name: Export only source delta and exact tree
        run: |
          mkdir -p "$RUNNER_TEMP/security-source"
          git diff --binary 7fab604ebbc926150e64964c0d79aeb2d3860acf HEAD > "$RUNNER_TEMP/security-source/develop.patch"
          git ls-tree -r HEAD > "$RUNNER_TEMP/security-source/tree.txt"
          sha256sum "$RUNNER_TEMP/security-source/develop.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: security-source-develop
          path: ${{ runner.temp }}/security-source/
          retention-days: 3
          if-no-files-found: error
