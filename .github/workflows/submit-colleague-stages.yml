name: Submit verified colleague stages
on:
  push:
    branches: [chore/continuity-dev-snapshot-20260922]
    paths:
      - .github/workflows/submit-colleague-stages.yml
      - .dev-submit/**
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Reconstruct and verify exact three-stage Git history
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, pathlib, subprocess
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data)
          baseline = '28f0da1ec95043f6bfa37f6b7cd309f83c10c444'
          expected = [
              ('925b477d902d93d10367586d27ee28fcccbd6620', '748ea9654f8e1c27c96a745d8423f164e2178378'),
              ('42cf429badf013b009d770071df593614d945acc', '025bd526e8a47da3ba90bee3244b7c6235ae19ac'),
              ('ccb44556ed97a1298492f7005a5518b085f315ab', 'e286d89b0e36538b2a06b393a914a16dbc6119b6'),
          ]
          payload = b''.join(pathlib.Path(f'.dev-submit/part-{i:02}.bin').read_bytes() for i in range(5))
          assert len(payload) == 42328
          assert hashlib.sha256(payload).hexdigest() == '6e3a968f1f68adcc37c5c2714254e114568cc0cf861e4bf3224727e3f0992b44'
          decoder = lzma.LZMADecompressor()
          decoded = decoder.decompress(payload, max_length=1000000)
          assert decoder.eof and not decoder.unused_data
          stages = json.loads(decoded)
          assert len(stages) == len(expected)
          git('checkout', '--detach', baseline)
          parent = baseline
          for stage, (sha, tree) in zip(stages, expected):
              assert stage['sha'] == sha
              raw = stage['commit'].encode('utf-8')
              headers = raw.split(b'\n\n', 1)[0].decode().splitlines()
              assert headers[0] == 'tree ' + tree
              assert [h for h in headers if h.startswith('parent ')] == ['parent ' + parent]
              patch = stage['patch'].encode('utf-8')
              git('apply', '--check', '--unidiff-zero', '--index', data=patch)
              git('apply', '--unidiff-zero', '--index', data=patch)
              paths = git('diff', '--cached', '--name-only', '-z').decode().split('\0')
              for name in filter(None, paths):
                  assert name == 'AGENTS.md' or name.startswith(('source/', 'frontend/', 'scripts/', 'tests/', 'docs/')), name
                  assert '..' not in pathlib.PurePosixPath(name).parts
              actual_tree = git('write-tree').decode().strip()
              assert actual_tree == tree, (actual_tree, tree)
              actual_sha = git('hash-object', '-t', 'commit', '-w', '--stdin', data=raw).decode().strip()
              assert actual_sha == sha, (actual_sha, sha)
              git('update-ref', 'HEAD', sha, parent)
              assert not git('status', '--porcelain').strip()
              print('Verified stage:', sha, 'tree:', tree)
              parent = sha
          assert git('rev-list', '--count', baseline + '..HEAD').decode().strip() == '3'
          git('fsck', '--no-reflogs', '--connectivity-only')
          PY
      - name: Publish candidate branch only, without force
        run: |
          test "$(git rev-parse HEAD)" = ccb44556ed97a1298492f7005a5518b085f315ab
          git push origin HEAD:refs/heads/chore/colleague-stages-candidate-20260922
          echo 'Candidate contains three exact stage commits; product feature ref is not changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          git log -3 --format='%H %s' >> "$GITHUB_STEP_SUMMARY"
