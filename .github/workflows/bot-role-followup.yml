                  lines=path.read_text().splitlines(keepends=True)
              for start,end,replacement in reversed(change['ops']):
                  assert 0<=start<=end<=len(lines)
                  lines[start:end]=replacement.splitlines(keepends=True)
              path.parent.mkdir(parents=True,exist_ok=True);path.write_text(''.join(lines))
              assert git('hash-object',str(path)).decode().strip()==change['new']
              git('add',str(path))
          tree=git('write-tree').decode().strip()
          assert tree=='16a75749b83bf6cad18bf2063739c85d608b9612'
          commit='tree '+tree+'\nparent '+parent+'\nauthor BeeBot development <151381126+yongchaoyin@users.noreply.github.com> 1790086199 +0000\ncommitter BeeBot development <151381126+yongchaoyin@users.noreply.github.com> 1790086199 +0000\n\nfix(runtime): require proven group exit after macOS signal denial\n\nObserve a bounded macOS teardown race only for an owned runtime group. Accept ESRCH as explicit absence; preserve persistent permission errors and active-run fences. No repeated termination signals, elevated permissions or relaxed cancellation assertions. Eight fault-injection tests and 36 role contract/UI tests pass locally; both typechecks pass. Re-run exact macOS full and real Host/Shell validation before release.\n'
          sha=git('hash-object','-t','commit','-w','--stdin',data=commit.encode()).decode().strip()
          assert sha=='253a460e8f1c0c6f735237f3334ebb3c67a517f6'
          git('update-ref','HEAD',sha,parent)
          assert not git('status','--porcelain').strip()
          git('push','origin','HEAD:refs/heads/work/bot-role-candidate-20260922')
          print('Verified exact follow-up:',sha,tree)
          PY
  verify:
    needs: import
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 253a460e8f1c0c6f735237f3334ebb3c67a517f6
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - name: Exact source and environment
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 253a460e8f1c0c6f735237f3334ebb3c67a517f6
          mkdir -p /tmp/bot-role-final
          git log -3 --format='%H %s' > /tmp/bot-role-final/commits.txt
          git rev-parse HEAD^{tree} > /tmp/bot-role-final/tree.txt
          node --version > /tmp/bot-role-final/node.txt
          sw_vers > /tmp/bot-role-final/os.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run bootstrap
      - run: npm run icon:generate
      - name: Full source and regressions
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/bot-role-final/check.log
      - name: Frontend build
        shell: bash
        run: |
          set -o pipefail
          npm run frontend:build 2>&1 | tee /tmp/bot-role-final/frontend.log
      - name: Lossless publication
        shell: bash
        run: |
          set -o pipefail
          npm run publication:check 2>&1 | tee /tmp/bot-role-final/publication.log
      - name: Real Host and Shell with deterministic model
        shell: bash
        run: |
          set -o pipefail
          npm run node:test:integration 2>&1 | tee /tmp/bot-role-final/runtime.log
      - name: Repeat unchanged real cancellation regression twice
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            BEEBOT_RUNTIME_INTEGRATION=1 node --test --test-name-pattern='^cancelling an active run kills shell descendants and fences the Bot against blind restart$' tests/node-runtime.test.mjs 2>&1 | tee "/tmp/bot-role-final/cancellation-repeat-${attempt}.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-role-final-verification
          path: /tmp/bot-role-final/
          retention-days: 7
